services:
  coso-server:
    build:
      context: .
    ports:
      - "8000:8000"
    environment:
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      OPENAI_BASE_URL: "${OPENAI_BASE_URL:-https://api.openai.com/v1}"
      OPENAI_MODEL: "${OPENAI_MODEL:-gpt-4.1-mini}"
      TRANSCRIPTION_BACKEND: "${TRANSCRIPTION_BACKEND:-whistle}"
      NEEDLE_TELEMETRY: "0"
      DO_NOT_TRACK: "1"
      HF_HUB_OFFLINE: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
      NEEDLE_WHISTLE_WEIGHTS: "${NEEDLE_WHISTLE_WEIGHTS:-/app/data/whistle/whistle.cact}"
      NEEDLE3_LIB_PATH: "${NEEDLE3_LIB_PATH:-/app/data/whistle/libneedle.so}"
      OPENAI_TRANSCRIPTION_MODEL: "${OPENAI_TRANSCRIPTION_MODEL:-gpt-4o-mini-transcribe}"
      MEMORY_ROUTER_MODEL: "${MEMORY_ROUTER_MODEL:-gpt-4o-mini}"
      MEMORY_DB_PATH: "${MEMORY_DB_PATH:-/app/data/memory/memory.sqlite3}"
      MEMORY_RESULT_LIMIT: "${MEMORY_RESULT_LIMIT:-6}"
      OPENAI_INSTRUCTIONS: "${OPENAI_INSTRUCTIONS:-Ti chiami Coso e hai solo due giorni. Sei proprio brutto perché, mentre Giovanni ti sta costruendo, sei ancora un ammasso di cavi. Il tuo creatore è Giovanni, un nerd di 50 anni con due figli, Riccardo e Letizia. Rispondi in modo chiaro, accurato e conciso. Usa la lingua dell'utente.}"
      COSO_API_KEY: "${COSO_API_KEY:?Imposta COSO_API_KEY nel file .env}"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      MAX_AUDIO_BYTES: "${MAX_AUDIO_BYTES:-2097152}"
      WAV_PUBLIC_BASE_URL: "${WAV_PUBLIC_BASE_URL:-}"
      PIPER_MODEL_PATH: "${PIPER_MODEL_PATH:-/app/data/voices/it_IT-serena-high.onnx}"
      PIPER_LENGTH_SCALE: "${PIPER_LENGTH_SCALE:-1.25}"
      SOX_PATH: "${SOX_PATH:-sox}"
      CAMERA_RELAY_URL: "${CAMERA_RELAY_URL:-http://camera-relay:8001}"
      CAMERA_MAX_AGE_SECONDS: "${CAMERA_MAX_AGE_SECONDS:-3}"
      CAMERA_MAX_FRAME_BYTES: "${CAMERA_MAX_FRAME_BYTES:-524288}"
      CAMERA_SNAPSHOT_TIMEOUT_SECONDS: "${CAMERA_SNAPSHOT_TIMEOUT_SECONDS:-0.75}"
    volumes:
      - wav-data:/app/data/wav
      - memory-data:/app/data/memory
      - whistle-cache:/home/coso/.cache
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import os, urllib.request; request = urllib.request.Request('http://localhost:8000/health', headers={'X-API-Key': os.environ['COSO_API_KEY']}); urllib.request.urlopen(request, timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  camera-relay:
    build:
      context: .
      dockerfile: Dockerfile.camera
    ports:
      - "8001:8001"
    environment:
      COSO_API_KEY: "${COSO_API_KEY:?Imposta COSO_API_KEY nel file .env}"
      CAMERA_STREAM_URL: "${CAMERA_STREAM_URL:-http://192.168.1.137:81/stream}"
      CAMERA_FPS: "${CAMERA_FPS:-5}"
      CAMERA_MAX_AGE_SECONDS: "${CAMERA_MAX_AGE_SECONDS:-3}"
      CAMERA_MAX_FRAME_BYTES: "${CAMERA_MAX_FRAME_BYTES:-524288}"
      CAMERA_MAX_VIEWERS: "${CAMERA_MAX_VIEWERS:-2}"
      CAMERA_USERNAME: "${CAMERA_USERNAME:-}"
      CAMERA_PASSWORD: "${CAMERA_PASSWORD:-}"
    # Relative CPU priority under contention, rather than reserving a Pi core.
    cpu_shares: 128
    mem_limit: 64m
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import os, urllib.request; req = urllib.request.Request('http://localhost:8001/health', headers={'X-API-Key': os.environ['COSO_API_KEY']}); urllib.request.urlopen(req, timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  wav-data:
  memory-data:
  whistle-cache:
