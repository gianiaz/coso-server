services:
  coso-server:
    build:
      context: .
    ports:
      - "8000:8000"
    environment:
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      OPENAI_BASE_URL: "${OPENAI_BASE_URL:-https://api.openai.com/v1}"
      OPENAI_MODEL: "${OPENAI_MODEL:-gpt-4.1-mini}"
      OPENAI_INSTRUCTIONS: "${OPENAI_INSTRUCTIONS:-Rispondi in modo chiaro, accurato e conciso. Usa la lingua dell'utente.}"
      COSO_API_KEY: "${COSO_API_KEY:-}"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
